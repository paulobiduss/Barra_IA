name: Release

# Cria uma release com os binarios de Windows (.exe) e macOS (.app) quando uma
# tag de versao (ex.: v1.0.0) e enviada. Os artefatos sao compilados nos
# proprios runners de cada SO, porque PyInstaller nao faz cross-compile.
# Tambem pode ser disparado manualmente (aba Actions) informando a versao: a
# action cria a tag no commit do run, sem precisar de `git push` da tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release a criar (ex.: v1.1.0). Vazio = so compila."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        # Pillow permite ao PyInstaller converter o icon.png em .ico no Windows
        # (o --icon do Windows exige .ico/.exe).
        run: python -m pip install -r requirements.txt pillow

      - name: Build (.exe) com PyInstaller
        run: |
          python -m PyInstaller -y --clean --onedir --windowed `
            --name BarraUsoIA `
            --icon assets/icon.png `
            --add-data "assets;assets" `
            --hidden-import PyQt6.QtCore `
            --hidden-import PyQt6.QtGui `
            --hidden-import PyQt6.QtWidgets `
            --hidden-import PyQt6.sip `
            main.py

      - name: Empacotar .zip portatil
        run: Compress-Archive -Path dist/BarraUsoIA -DestinationPath dist/BarraUsoIA-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: BarraUsoIA-windows
          path: dist/BarraUsoIA-windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Build (.app) com build.sh
        run: bash build.sh

      - name: Empacotar .app em .zip
        run: ditto -c -k --keepParent dist/BarraUsoIA.app dist/BarraUsoIA-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BarraUsoIA-macos
          path: dist/BarraUsoIA-macos.zip

  publish-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    # Publica quando disparado por uma tag ou manualmente com `tag` informado.
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Criar release com os binarios
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/BarraUsoIA-windows/BarraUsoIA-windows.zip
            artifacts/BarraUsoIA-macos/BarraUsoIA-macos.zip
          generate_release_notes: true
